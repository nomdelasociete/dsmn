name: dsmn
options:
  minimumXcodeGenVersion: 2.45.0
  deploymentTarget:
    macOS: "13.0"
settings:
  base:
    DEVELOPMENT_TEAM: JSFMAD28GS
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: Apple Development
    DSMN_SPARKLE_PUBLIC_ED_KEY: ""
    DSMN_UPDATE_FEED_URL: ""
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    SWIFT_VERSION: "6.0"
    ENABLE_HARDENED_RUNTIME: YES
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.9.2
targets:
  DSMNCore:
    type: framework
    platform: macOS
    sources:
      - path: Sources/DSMNCore
    info:
      path: macos/DSMNCore/Info.plist
      properties:
        CFBundleIdentifier: com.nomdelasociete.dsmn.core
        CFBundleName: DSMNCore
        CFBundlePackageType: FMWK
        CFBundleShortVersionString: "0.1.10"
        CFBundleVersion: "11"
        LSMinimumSystemVersion: "13.0"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nomdelasociete.dsmn.core
        PRODUCT_NAME: DSMNCore
  dsmn:
    type: application
    platform: macOS
    sources:
      - path: Sources/dsmnapp
      - path: macos/LaunchDaemons/com.nomdelasociete.dsmn.helper.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchDaemons
    dependencies:
      - target: DSMNCore
        embed: true
      - package: Sparkle
        product: Sparkle
      - target: dsmnd
        embed: true
        link: false
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Library/LaunchDaemons
      - target: dsmnctl
        embed: true
        link: false
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Library/Helpers
    info:
      path: macos/dsmn/Info.plist
      properties:
        CFBundleDisplayName: dsmn
        CFBundleIdentifier: com.nomdelasociete.dsmn
        CFBundleIconFile: dsmn
        CFBundleName: dsmn
        CFBundleShortVersionString: "0.1.10"
        CFBundleVersion: "11"
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: "13.0"
        LSUIElement: true
        NSPrincipalClass: NSApplication
        SUAllowsAutomaticUpdates: true
        SUEnableAutomaticChecks: true
        SUFeedURL: "$(DSMN_UPDATE_FEED_URL)"
        SUPublicEDKey: "$(DSMN_SPARKLE_PUBLIC_ED_KEY)"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nomdelasociete.dsmn
        PRODUCT_NAME: dsmn
  dsmnd:
    type: tool
    platform: macOS
    sources:
      - path: Sources/dsmnd
    dependencies:
      - target: DSMNCore
    settings:
      base:
        OTHER_SWIFT_FLAGS: "$(inherited) -parse-as-library"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../../Frameworks"
        PRODUCT_BUNDLE_IDENTIFIER: com.nomdelasociete.dsmn.helper
        PRODUCT_NAME: dsmnd
        SKIP_INSTALL: YES
  dsmnctl:
    type: tool
    platform: macOS
    sources:
      - path: Sources/dsmnctl
    dependencies:
      - target: DSMNCore
    settings:
      base:
        OTHER_SWIFT_FLAGS: "$(inherited) -parse-as-library"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../../Frameworks"
        PRODUCT_BUNDLE_IDENTIFIER: com.nomdelasociete.dsmn.dsmnctl
        PRODUCT_NAME: dsmnctl
        SKIP_INSTALL: YES
schemes:
  dsmn:
    build:
      targets:
        dsmn: all
        dsmnd: all
        dsmnctl: all
    run:
      config: Debug
  dsmnd:
    build:
      targets:
        dsmnd: all
    run:
      config: Debug
  dsmnctl:
    build:
      targets:
        dsmnctl: all
    run:
      config: Debug
